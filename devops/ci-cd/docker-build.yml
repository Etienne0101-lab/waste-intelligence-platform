name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build hub-api image
        run: docker build -f devops/docker/api.Dockerfile -t waste-hub-api:latest .
      - name: Build streamlit image
        run: docker build -f devops/docker/streamlit.Dockerfile -t waste-streamlit:latest .
      - name: Build mqtt image
        run: docker build -f devops/docker/mqtt.Dockerfile -t waste-mqtt:latest .
