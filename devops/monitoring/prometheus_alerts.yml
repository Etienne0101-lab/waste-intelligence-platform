global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'hub-api'
    static_configs:
      - targets: ['hub-api:5000']
    metrics_path: '/metrics'

  - job_name: 'mqtt'
    static_configs:
      - targets: ['mqtt:1883']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
